<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>🔔 내 알림</title><style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#0f766e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--text:#e5e7eb;--muted:#9ca3af;--line:#2a2f3a;--accent:#2dd4bf}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px}header a{color:var(--accent);text-decoration:none;font-size:14px}main{padding:4px 16px 40px;max-width:760px;margin:0 auto}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;scroll-margin-top:60px}
section:target{outline:3px solid var(--accent)}pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:6px 0 8px}
.muted{color:var(--muted);font-size:13px}.rel{display:flex;flex-wrap:wrap;gap:6px}.rel a{padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:13px}
</style></head><body><header><h1>🔔 내 알림</h1><a href="index.html">📱 시황·뉴스 →</a></header><main><p class="muted">아직 알림이 없어요</p></main></body></html>
